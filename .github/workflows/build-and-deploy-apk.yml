name: Build & Deploy Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to produce'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_release:
        description: 'Create a GitHub Release (requires tag or manual trigger)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets, Licenses & Keystores
        run: |
          # 1. Accept Android SDK licenses
          yes | sdkmanager --licenses || true

          # 2. Prepare .env and .env.example files for Secrets Gradle Plugin
          touch .env .env.example
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # 3. Handle debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Handle release fallback keystore
          if [ ! -f my-upload-key.jks ] || [ ! -s my-upload-key.jks ]; then
            echo "Generating fallback upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi

          # 5. Make gradlew executable
          chmod +x ./gradlew || true

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon || true

      - name: Collect APK Artifacts
        run: |
          mkdir -p release-apks
          # Find and copy all generated APKs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} release-apks/ \; || true
          
          # Provide standardized named copies for easy user recognition
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp -v app/build/outputs/apk/debug/app-debug.apk release-apks/traffmonetizer-node-runner-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp -v app/build/outputs/apk/release/app-release.apk release-apks/traffmonetizer-node-runner-release.apk
          fi
          
          echo "Collected APKs in release-apks/:"
          ls -la release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traffmonetizer-node-runner-apk
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

